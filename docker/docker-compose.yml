# SIMU · CDMX — service definitions.
# Normally started from the repo root with `docker compose up` (see ../compose.yaml).
# Standalone: docker compose -f docker/docker-compose.yml --env-file .env up
# Paths below are relative to this docker/ directory.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/20-init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    init: true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      DEVICE_INGEST_KEY: ${DEVICE_INGEST_KEY:?Define DEVICE_INGEST_KEY en .env}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Define SEED_DEMO_PASSWORD en .env}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      # migrate deploy + seed run before the server listens
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulator
    init: true
    environment:
      SIMULATOR_HOST: 0.0.0.0
      SIMULATOR_PORT: 4000
      SIMULATOR_API_URL: http://api:3000
      SIMULATOR_DB_PATH: /data/simu-gateway.db
      DEVICE_INGEST_KEY: ${DEVICE_INGEST_KEY:?Define DEVICE_INGEST_KEY en .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Internal only (spec §2.3). The /control panel is exposed in Phase 4.
    expose:
      - '4000'
    volumes:
      - simulator-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    profiles: ['ai']
    build:
      context: ../apps/ai-service
    environment:
      ANALYZER_BACKEND: ${ANALYZER_BACKEND:-mock}
    expose:
      - '8000'
    restart: unless-stopped

volumes:
  pgdata:
  simulator-data:
